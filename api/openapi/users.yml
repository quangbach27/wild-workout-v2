openapi: 3.0.3
info:
  title: Users API
  version: 1.0.0
servers:
  - url: http://localhost:4000
security:
  - bearerAuth: []
paths:
  /api/v1/trainers:
    get:
      operationId: getTrainers
      summary: Get the trainers
      description: >
        Returns the trainers ordered by display name. The list is paginated with `page` and
        `pageSize`; `total` is the number of trainers across all pages.
      parameters:
        - name: page
          in: query
          description: Page number, starting at 1
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Number of trainers per page
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: One page of trainers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainersPage"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users/onboard:
    post:
      operationId: onboardUser
      summary: Onboard the user from the session
      description: >
        Creates the user from the session (uuid and role), with a zero balance. The role is the
        session's trainer or attendee role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardUserRequest"
      responses:
        "204":
          description: User onboarded
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/users/{userId}:
    get:
      operationId: getUserInfo
      summary: Retrieve User Info
      parameters:
        - name: userId
          in: path
          required: true
          description: The unique identifier of the user
          schema:
            type: string
      responses:
        "200":
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    InvalidInput:
      description: The request is not valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The user is not onboarded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The user is already onboarded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    OnboardUserRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
    TrainersPage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        pagination:
          $ref: "#/components/schemas/Pagination"
    Pagination:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          description: Number of items across all pages
    User:
      type: object
      required: [uuid, displayName, balance, role]
      properties:
        uuid:
          type: string
        displayName:
          type: string
        balance:
          type: integer
        role: 
          $ref: "#/components/schemas/Role"

    Role:
      type: string
      x-go-type: shared.Role
      x-go-type-import:
        path: backend/internal/shared

    Error:
      type: object
      required: [message, slug]
      properties:
        message:
          type: string
        slug:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      properties:
        entity_type:
          type: string
        entity_id:
          type: string
        error_slug:
          type: string
        message:
          type: string
