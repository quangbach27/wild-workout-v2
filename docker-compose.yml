name: "wild-workouts"

services:
  wild-workout-backend:
    container_name: wild-workout-backend
    build:
      context: backend/docker/app-local
    volumes:
      # Source code volumes
      - ./backend/internal:/app/internal
      - ./backend/cmd:/app/cmd
      # Go module files
      - ./backend/go.mod:/app/go.mod
      - ./backend/go.sum:/app/go.sum
      # Go cache volumes (kept inside backend/, git-ignored)
      - ./backend/.go/pkg:/app/go/pkg
      - ./backend/.go-cache:/app/go-cache
    working_dir: /app
    ports:
      - "127.0.0.1:4000:4000" # App port (must match PORT in backend/.env)
    env_file:
      - ./backend/.env
    environment:
      GOPATH: /app/go # so module cache lands in /app/go/pkg/mod
      GOCACHE: /app/go-cache
    depends_on:
      wild-workout-db:
        condition: service_healthy

  wild-workout-db:
    image: postgres:17.6-alpine3.22
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wild-workout
    volumes:
      - wild-workout-postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U user -d wild-workout
      interval: 1s
      retries: 120
      start_period: 2s

volumes:
  wild-workout-postgres_data:
