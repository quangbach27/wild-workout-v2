name: Backend Commit Stage
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "backend/**"
  #     - ".github/workflows/backend-commit-stage.yml"
  # pull_request:
  #   branches:
  #     - main
  #   types:
  #     - opened
  #     - reopened
  #     - synchronize
  #     - ready_for_review
  #     - labeled
  #     - unlabeled
  #   paths:
  #     - "backend/**"
  #     - ".github/workflows/backend-commit-stage.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend
  VERSION: ${{ github.sha }}

jobs:
  build:
    name: Build and Test
    if: github.event_name == 'push' || (!github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'skip-ci'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: wild-workout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "backend/go.mod"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Check go.mod / go.sum are tidy
        working-directory: backend
        run: |
          make tidy
          git diff --exit-code go.mod go.sum

      - name: Lint
        working-directory: backend
        run: make lint

      - name: Test
        working-directory: backend
        run: make test-unit

      - name: Build
        working-directory: backend
        run: go build -v ./...

      # - uses: anchore/scan-action@v7
      #   id: scan
      #   with:
      #     path: "backend"
      #     fail-build: false
      #     severity-cutoff: high

      # - name: Upload Anchore scan SARIF report
      #   uses: github/codeql-action/upload-sarif@v4
      #   with:
      #     sarif_file: ${{ steps.scan.outputs.sarif }}
      #     category: backend-lib

  package:
    name: Package and Publish
    if: github.event_name == 'workflow_dispatch'
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Production runs on an arm64 (Graviton) instance, so build for arm64.
      - name: Build container image
        run: docker buildx build --platform linux/arm64 --load -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} -f backend/docker/app-prod/Dockerfile backend

      # - uses: anchore/scan-action@v7
      #   id: scan
      #   with:
      #     image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
      #     fail-build: false
      #     severity-cutoff: high

      # - name: Upload Anchore scan SARIF report
      #   uses: github/codeql-action/upload-sarif@v4
      #   with:
      #     sarif_file: ${{ steps.scan.outputs.sarif }}
      #     category: backend-image

      - name: Log into container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      - name: Publish image (latest)
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
