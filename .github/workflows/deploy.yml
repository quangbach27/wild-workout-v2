name: Deploy

on:
  workflow_dispatch:
    inputs:
      app:
        description: What to deploy
        type: choice
        options:
          - backend
          - web
      tag:
        description: Image tag (commit sha published by the commit stage)
        type: string
        default: latest

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.app }} ${{ inputs.tag }}
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          sparse-checkout: deployment

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Roll out on the instance
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          APP: ${{ inputs.app }}
          TAG: ${{ inputs.tag }}
        run: |
          GHCR_REPO="${GITHUB_REPOSITORY,,}"
          case "$APP" in
            backend) SERVICE="wild-workout-backend"; TAG_VAR="BACKEND_TAG" ;;
            web) SERVICE="wild-workout-web"; TAG_VAR="WEB_TAG" ;;
          esac

          COMPOSE_FILE=$(base64 -w0 deployment/docker-compose.prod.yml)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $APP $TAG" \
            --parameters "commands=[
              \"set -e\",
              \"cd /opt/app\",
              \"echo $COMPOSE_FILE | base64 -d > docker-compose.prod.yml\",
              \"export GHCR_REPO=$GHCR_REPO $TAG_VAR=$TAG\",
              \"docker compose -f docker-compose.prod.yml pull $SERVICE\",
              \"docker compose -f docker-compose.prod.yml up -d $SERVICE\",
              \"docker image prune -f\"
            ]" \
            --query Command.CommandId --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
