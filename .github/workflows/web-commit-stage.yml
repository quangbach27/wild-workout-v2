name: Web Commit Stage
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "web/**"
  #     - ".github/workflows/web-commit-stage.yml"
  # pull_request:
  #   branches:
  #     - main
  #   types:
  #     - opened
  #     - reopened
  #     - synchronize
  #     - ready_for_review
  #     - labeled
  #     - unlabeled
  #   paths:
  #     - "web/**"
  #     - ".github/workflows/web-commit-stage.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-web
  VERSION: ${{ github.sha }}

jobs:
  build:
    name: Build and Test
    if: github.event_name == 'push' || (!github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'skip-ci'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build

      # - uses: anchore/scan-action@v7
      #   id: scan
      #   with:
      #     path: "web"
      #     fail-build: false
      #     severity-cutoff: high

      # - name: Upload Anchore scan SARIF report
      #   uses: github/codeql-action/upload-sarif@v4
      #   with:
      #     sarif_file: ${{ steps.scan.outputs.sarif }}
      #     category: web-lib

  package:
    name: Package and Publish
    if: github.event_name == 'workflow_dispatch'
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Production runs on an arm64 (Graviton) instance, so build for arm64.
      - name: Build container image
        # Vite inlines VITE_* at build time, so the production values come from repository variables.
        run: |
          docker buildx build --platform linux/arm64 --load \
            --build-arg VITE_API_URL=${{ vars.VITE_API_URL }} \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY=${{ vars.VITE_CLERK_PUBLISHABLE_KEY }} \
            --build-arg VITE_FUTURE_WEEKS=${{ vars.VITE_FUTURE_WEEKS }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} \
            -f web/docker/app-prod/Dockerfile web

      # - uses: anchore/scan-action@v7
      #   id: scan
      #   with:
      #     image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
      #     fail-build: false
      #     severity-cutoff: high

      # - name: Upload Anchore scan SARIF report
      #   uses: github/codeql-action/upload-sarif@v4
      #   with:
      #     sarif_file: ${{ steps.scan.outputs.sarif }}
      #     category: web-image

      - name: Log into container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      - name: Publish image (latest)
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
