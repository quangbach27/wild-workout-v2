server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # add_header in a location replaces the ones from the server level, so the
    # security headers live in a snippet that each location includes.
    # connect-src must list the API origin (VITE_API_URL); localhost:4000 is the default.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        # Hashed assets can be cached forever.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback for client-side routes.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
