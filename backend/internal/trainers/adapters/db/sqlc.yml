
version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "migrations"
    gen:
      go:
        package: "dbmodels"
        out: "dbmodels"
        sql_package: "pgx/v5"
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          # Common type overrides
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"

          # hours
          - db_type: "trainers.hour_status"
            nullable: true
            go_type:
              import: "backend/internal/trainers/domain"
              type: "HourStatus"
              pointer: true

          - db_type: "trainers.hour_status"
            go_type:
              import: "backend/internal/trainers/domain"
              type: "HourStatus"
